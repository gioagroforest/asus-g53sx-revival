# G53 diagnostic stick. Boots straight away; there is no menu to answer.
set timeout=0
set default=0
set fallback=0
set extra_args=""
export extra_args

# Counts every start, so the PC can see the firmware reached the stick even if
# Linux never runs. One more x in boot/grub/grubenv means one more start.
if [ -s "$prefix/grubenv" ]; then
    load_env
fi
set grub_starts="${grub_starts}x"
save_env grub_starts

# Two short beeps, if this laptop's speaker is wired for them.
play 480 880 1 0 1 880 1

# Kernel options can be changed on the PC by editing this file.
if [ -f /grub-extra.cfg ]; then
    source /grub-extra.cfg
fi

# Server on the SSD.
#  g53_next=ssd  -> boot the SSD ONCE (cleared here first, so the next start is diag)
#  g53_boot=ssd  -> boot the SSD every time (set only after the SSD system is proven)
#  g53_next=diag -> boot diag once even when g53_boot=ssd
# If the SSD can not be found, fallback=0 boots diag.
if [ "${g53_next}" = "ssd" ]; then
    set g53_next=
    save_env g53_next
    set default=1
elif [ "${g53_next}" = "diag" ]; then
    set g53_next=
    save_env g53_next
elif [ "${g53_boot}" = "ssd" ]; then
    set default=1
fi

menuentry "G53 diagnostics" {
    linux /diag/vmlinuz nomodeset panic=0 ignore_loglevel consoleblank=0 ${extra_args}
    initrd /diag/initrd.zst
}

menuentry "G53 server (Ubuntu 22.04 on SSD)" {
    insmod part_msdos
    insmod ext2
    search --no-floppy --fs-uuid --set=root ROOT-FS-UUID
    linux /boot/vmlinuz root=UUID=ROOT-FS-UUID ro panic=10 nomodeset consoleblank=0
    initrd /boot/initrd.img
}
